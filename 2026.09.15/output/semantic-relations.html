<div id="wf-relations-proposal" aria-label="PC와 모바일 관계 표현 시안">
  <style>
    @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css');
    #wf-relations-proposal { color-scheme:light; --wf-text:#252a34; --wf-muted:#556575; --wf-border:#ccdce6; --wf-surface:#edf5fa; font-family:Pretendard,sans-serif; color:var(--wf-text); }
    #wf-relations-proposal * { box-sizing:border-box; }
    #wf-relations-proposal .wf-label { margin:0 0 12px; font-size:13px; font-weight:600; color:var(--wf-muted); }
    #wf-relations-proposal .wf-panel { background:#fff; border:1px solid var(--wf-border); border-top:2px solid #58b4df; border-radius:6px; padding:16px; }
    #wf-relations-proposal .wf-desktop { margin-bottom:24px; }
    #wf-relations-proposal .wf-toolbar { display:flex; align-items:flex-start; justify-content:space-between; gap:24px; flex-wrap:wrap; }
    #wf-relations-proposal .wf-controls { display:flex; gap:8px; }
    #wf-relations-proposal button { font:500 13px/1.4 Pretendard,sans-serif; min-height:44px; padding:8px 12px; border:1px solid #849aaa; border-radius:4px; background:#fff; color:var(--wf-text); }
    #wf-relations-proposal .wf-play { background:#ba4034; border-color:#ba4034; color:#fff; }
    #wf-relations-proposal .wf-meta { flex:1; min-width:240px; max-width:360px; }
    #wf-relations-proposal .wf-technology { margin:0 0 12px; color:var(--wf-muted); font-size:13px; font-weight:600; line-height:1.6; text-align:right; }
    #wf-relations-proposal .wf-graph { display:grid; gap:8px; }
    #wf-relations-proposal .wf-relation { display:grid; grid-template-columns:minmax(0,1fr) minmax(72px,1fr) minmax(0,1.15fr); align-items:center; gap:8px; }
    #wf-relations-proposal .wf-node { background:var(--wf-surface); border:1px solid var(--wf-border); border-radius:6px; padding:8px; text-align:center; font-size:13px; line-height:1.4; word-break:keep-all; overflow-wrap:anywhere; }
    #wf-relations-proposal .wf-edge { color:var(--wf-muted); text-align:center; font-size:12px; line-height:1.4; padding-bottom:6px; border-bottom:1px solid #849aaa; position:relative; word-break:keep-all; }
    #wf-relations-proposal .wf-edge:after { content:''; position:absolute; bottom:-3px; right:0; width:5px; height:5px; border-top:1px solid #849aaa; border-right:1px solid #849aaa; transform:rotate(45deg); }
    #wf-relations-proposal .wf-mobile { max-width:390px; margin:0 auto; }
    #wf-relations-proposal .wf-mobile .wf-toolbar { display:block; }
    #wf-relations-proposal .wf-mobile .wf-meta { min-width:0; max-width:none; margin-top:16px; }
    #wf-relations-proposal .wf-mobile .wf-technology { text-align:left; }
    #wf-relations-proposal .wf-boundary { margin:16px -16px -16px; padding:16px; background:#fafbfd; border-top:1px solid var(--wf-border); text-align:center; color:var(--wf-muted); font-size:12px; border-radius:0 0 6px 6px; }
    #wf-relations-proposal[data-outline="true"] .wf-node { background:#fff; }
    @media(max-width:420px) { #wf-relations-proposal .wf-meta { min-width:0; flex-basis:100%; max-width:none; } #wf-relations-proposal .wf-technology { text-align:left; } }
  </style>
  <div class="wf-desktop">
    <p class="wf-label">PC · 캔버스 상단 도구 영역</p>
    <section class="wf-panel" aria-label="PC 캔버스 도구 영역">
      <div class="wf-toolbar">
        <div class="wf-controls"><button type="button">화면 초기화</button><button type="button" class="wf-play" aria-pressed="false">재생</button></div>
        <div class="wf-meta"><p class="wf-technology">Top-Down 설계 · W3C RDF/OWL 2 기반</p><div class="wf-graph" aria-live="polite"></div></div>
      </div>
      <div class="wf-boundary">캔버스 영역</div>
    </section>
  </div>
  <div class="wf-mobile">
    <p class="wf-label">모바일 · 390px 기준</p>
    <section class="wf-panel" aria-label="모바일 캔버스 도구 영역">
      <div class="wf-toolbar">
        <div class="wf-controls"><button type="button">화면 초기화</button><button type="button" class="wf-play" aria-pressed="false">재생</button></div>
        <div class="wf-meta"><p class="wf-technology">Top-Down 설계 · W3C RDF/OWL 2 기반</p><div class="wf-graph" aria-live="polite"></div></div>
      </div>
      <div class="wf-boundary">캔버스 영역</div>
    </section>
  </div>
  <script>
    (() => {
      const root = document.getElementById('wf-relations-proposal');
      const state = { example:'roles', outline:false };
      const examples = {
        roles:[['역할','수행한다','과업'],['역할','부담한다','소통 의무']],
        collaboration:[['의견','뒷받침한다','의사 결정'],['실행 결과','축적된다','협업 지식']],
        research:[['근거','검토에 쓰인다','가설'],['가설 변화','반영된다','실험 설계']]
      };
      function render() {
        root.dataset.outline=String(state.outline);
        root.querySelectorAll('.wf-graph').forEach(graph=>{
          graph.replaceChildren(...examples[state.example].map(parts=>{
            const row=document.createElement('div'); row.className='wf-relation';
            parts.forEach((text,i)=>{ const span=document.createElement('span'); span.className=i===1?'wf-edge':'wf-node'; span.textContent=text; row.append(span); });
            return row;
          }));
        });
        root.querySelectorAll('.wf-technology').forEach(el=>{el.textContent=state.example==='roles'?'Top-Down 설계 · W3C RDF/OWL 2 기반':'Bottom-Up 디자인';});
      }
      render();
      root.querySelectorAll('.wf-controls').forEach(group=>{
        const buttons=group.querySelectorAll('button');
        buttons[1].onclick=()=>{ const playing=buttons[1].getAttribute('aria-pressed')!=='true'; buttons[1].setAttribute('aria-pressed',String(playing)); buttons[1].textContent=playing?'일시 정지':'재생'; };
        buttons[0].onclick=()=>{ buttons[1].setAttribute('aria-pressed','false'); buttons[1].textContent='재생'; };
      });
      if(globalThis.Tweak) {
        const tweak=new Tweak({container:root,onChange:render});
        tweak.addSelect(state,'example',{label:'관계 문구',options:[{label:'역할과 과업',value:'roles'},{label:'협업 지식',value:'collaboration'},{label:'연구 노트',value:'research'}]});
        tweak.addToggle(state,'outline',{label:'노드 배경 없이 표현'});
      }
    })();
  </script>
</div>
